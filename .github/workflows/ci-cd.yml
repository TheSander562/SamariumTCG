name: CI/CD Pipeline

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/**'
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'Dockerfile-slim'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'prisma.config.ts'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually? (optionally)'
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: samariumtcg
          POSTGRES_PASSWORD: samariumtcg
          POSTGRES_DB: samariumtcg
        options: >-
          --health-cmd="pg_isready -U samariumtcg -d samariumtcg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      #- name: Run tests
      #  run: npm run test
      #  env:
      #    DATABASE_URL: postgresql://samariumtcg:samariumtcg@localhost:5432/samariumtcg

      - name: Run lint
        run: npm run lint

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/tags/')
      ))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # 4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # 4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # 4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # 6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Branch name (main, feature-x)
            type=ref,event=branch
            # Git tags (v1.2.3)
            type=ref,event=tag
            # SHA only on default branch (avoid spam)
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            # Latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # 7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: samariumtcg
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
